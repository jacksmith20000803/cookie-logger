[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/log"
  to = "/.netlify/functions/record-post"
  status = 200
  force = true

  [[redirects]]
  from = "/logs"
  to = "/.netlify/functions/view-logs"
  status = 200

  [[redirects]]
  from = "/api/log/delete"
  to = "/.netlify/functions/delete-log"
  status = 200

  [[redirects]]
  from = "/"
  to = "/.netlify/functions/view-logs"
  status = 200